name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Slint build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Doctor and info run against every fixture
        run: |
          cargo build --release
          for f in fixtures/*/; do
            echo "== $f"
            TSPMO_SYSROOT="$f" ./target/release/tspmo info
            TSPMO_SYSROOT="$f" ./target/release/tspmo doctor || true
          done

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
      - name: Build the Arch packages with makepkg
        run: |
          pacman -Syu --noconfirm --needed git rust fontconfig libxkbcommon wayland
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd packaging/arch
          su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE' && makepkg -f --nodeps"
          ls -la *.pkg.tar.zst
