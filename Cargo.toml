[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
tspmo-sys = { path = "crates/tspmo-sys" }
tspmo-core = { path = "crates/tspmo-core" }
zbus = { version = "5.13", default-features = false, features = ["blocking-api", "async-io"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Small, fast binaries: the daemon and CLI must cost as little as possible.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# The GUI favours size; the daemon and CLI favour speed.

[profile.release.package.tspmo-gui]
opt-level = "s"
strip = "symbols"

# The GUI's own dependencies (Slint, the Wayland client, text layout) also favour size. The
# daemon does not use them, and zbus stays at opt-level 3 for both.
[profile.release.package.slint]
opt-level = "s"
[profile.release.package.i-slint-core]
opt-level = "s"
[profile.release.package.i-slint-common]
opt-level = "s"
[profile.release.package.i-slint-renderer-software]
opt-level = "s"
[profile.release.package.i-slint-backend-selector]
opt-level = "s"
[profile.release.package.smithay-client-toolkit]
opt-level = "s"
[profile.release.package.wayland-client]
opt-level = "s"
[profile.release.package.wayland-backend]
opt-level = "s"
[profile.release.package.calloop]
opt-level = "s"
[profile.release.package.parley]
opt-level = "s"
[profile.release.package.parley_engine]
opt-level = "s"
[profile.release.package.fontique]
opt-level = "s"
[profile.release.package.harfrust]
opt-level = "s"
