[package]
name = "tspmo-gui"
description = "tspmo popup: modes, GPU, screen, battery, fans, power limits, lighting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
build = "build.rs"

[[bin]]
name = "tspmo-gui"
path = "src/main.rs"

[features]
# OpenGL (femtovg) renderer instead of the software one. Off by default: the software renderer
# never touches EGL, so the NVIDIA GPU cannot be woken.
gl = ["slint/renderer-femtovg"]

[dependencies]
zbus.workspace = true
futures-lite = { version = "2", default-features = false }
rustix = { version = "1.1", features = ["process"] }
slint = { version = "1.19", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
] }

[build-dependencies]
slint-build = "1.19"

[lints]
workspace = true
