PACKAGE_NAME="tspmo-hid-asus"
PACKAGE_VERSION="1"
# hid-asus from the running kernel's own source + tspmo's wake-before-report fix,
# rebuilt automatically for every kernel. See 0001-*.patch.
PRE_BUILD="fetch-source.sh ${kernelver}"
MAKE[0]="make KERNELRELEASE=${kernelver} KDIR=${kernel_source_dir}"
CLEAN="make KERNELRELEASE=${kernelver} KDIR=${kernel_source_dir} clean; rm -f hid-asus.c hid-ids.h"
BUILT_MODULE_NAME[0]="hid-asus"
DEST_MODULE_LOCATION[0]="/kernel/drivers/hid"
AUTOINSTALL="yes"
