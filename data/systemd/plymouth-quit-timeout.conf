# Installed by tspmo as /usr/lib/systemd/system/plymouth-quit.service.d/50-tspmo.conf
#
# On hybrid NVIDIA laptops `plymouth quit` can hang for its whole 20 s timeout, leaving
# plymouthd running for the entire session with the GPUs' DRM devices open. That keeps the
# dGPU from staying asleep and blocks GPU switching. Give it 3 s, then make sure it is gone.
[Service]
ExecStart=
ExecStart=-/usr/bin/timeout 3 /usr/bin/plymouth quit
ExecStartPost=-/usr/bin/pkill -x plymouthd
TimeoutSec=8
