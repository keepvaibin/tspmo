# Installed by tspmo as /usr/lib/systemd/user/plasma-kwin_wayland.service.d/50-tspmo.conf
#
# tspmod writes /run/tspmo/compositor.env at boot for the current GPU mode. Outside Ultimate it
# makes KWin load only Mesa's EGL, so the desktop composites on the iGPU and holds nothing on
# the NVIDIA GPU but its display device, which KWin hands back when tspmo switches to Eco.
# Apps are unaffected: they still get the NVIDIA GPU through PRIME offload.
[Service]
EnvironmentFile=-/run/tspmo/compositor.env
