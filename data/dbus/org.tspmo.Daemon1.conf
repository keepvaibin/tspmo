<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (tspmod) may own the names. -->
  <policy user="root">
    <allow own="org.tspmo.Daemon1"/>
    <allow own="org.freedesktop.UPower.PowerProfiles"/>
    <allow own="net.hadess.PowerProfiles"/>
  </policy>
  <!-- Anyone may talk to it; changes are authorised per call with polkit. -->
  <policy context="default">
    <allow send_destination="org.tspmo.Daemon1"/>
    <allow send_destination="org.freedesktop.UPower.PowerProfiles"/>
    <allow send_destination="net.hadess.PowerProfiles"/>
  </policy>
</busconfig>
